name: Test

on:
  push:
    branches: [Dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, GCC 14
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GCC 14, Ninja and libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config libusb-1.0-0-dev

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the tests
        shell: bash
        env:
          CXX: g++-14
        run: ./test.cmd -j 4

  windows:
    name: Windows, UCRT64 GCC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GCC, CMake and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the tests
        shell: cmd
        run: .\test.cmd -j 4
