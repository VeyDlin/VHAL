name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (VHAL source + wiki)
        uses: actions/checkout@v4
        with:
          path: vhal

      - name: Checkout pages branch (docs site)
        uses: actions/checkout@v4
        with:
          ref: pages
          path: site

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        run: pip install -r site/generator/requirements.txt

      - name: Test generator
        run: python -m unittest discover -s site/generator -p "test_*.py" -v

      - name: Generate docs data
        run: |
          python site/generator/generate.py \
            --vhal-root vhal \
            --output site/client/src/generated \
            --docs-root vhal/.wiki

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: site/client

      - name: Cache semantic model
        uses: actions/cache@v4
        with:
          path: site/client/.cache/transformers
          key: semantic-all-MiniLM-L6-v2-q8-751bff37182d3f1213fa05d7196b954e230abad9-transformers-3.8.1-${{ hashFiles('site/client/package-lock.json') }}

      - name: Generate semantic embeddings
        run: npm run generate:semantic
        working-directory: site/client

      - name: Test client
        run: npm test
        working-directory: site/client

      - name: Build
        run: |
          npx vue-tsc -b
          npx vite build
        working-directory: site/client

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        working-directory: site/client

      - name: Test browser interactions
        run: npm run test:e2e
        working-directory: site/client

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
