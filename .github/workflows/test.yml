name: Test

on:
  push:
    branches: [Dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, GCC 14
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GCC 14, Ninja and libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config libusb-1.0-0-dev

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the tests
        shell: bash
        env:
          CXX: g++-14
        run: |
          g++-14 --version
          cmake --version
          ./test.cmd -j 4

  sanitizers:
    name: Linux, GCC 14, sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GCC 14, Ninja and libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config libusb-1.0-0-dev

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the host tests with the sanitizers
        shell: bash
        env:
          CXX: g++-14
        run: |
          g++-14 --version
          cmake --version
          ./test.cmd --sanitize -j 4

  windows:
    name: Windows, UCRT64 GCC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GCC, CMake and Ninja
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # The runner image has its own MinGW in C:\mingw64 on PATH, and a cmd step would use it. The UCRT64 tools go first instead.
      - name: Put the UCRT64 tools first on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run the tests
        shell: cmd
        run: |
          g++ --version
          cmake --version
          .\test.cmd -j 4
