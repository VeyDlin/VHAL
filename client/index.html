<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applies the color mode before the app starts, so the page does not flash in the wrong theme. The key and the
      // values are those of VueUse useColorMode, which Nuxt UI's UColorModeButton uses ('auto' follows the system).
      (function() {
        var mode = 'auto';
        try {
          var storedMode = localStorage.getItem('vueuse-color-scheme');
          if (storedMode === null) {
            // Preference saved by the previous theme switcher
            storedMode = localStorage.getItem('vhal-theme');
          }
          if (storedMode === 'light' || storedMode === 'dark') {
            mode = storedMode;
          }
        } catch (error) {
          // Storage may be unavailable in restricted browsing contexts.
        }
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>VHAL Documentation</title>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script>
      // Restore SPA path from 404.html redirect
      (function() {
        var p = new URLSearchParams(location.search).get('p');
        if (p) history.replaceState(null, '', '/VHAL' + p);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
